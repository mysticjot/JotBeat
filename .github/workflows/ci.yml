name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bvt:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify repository tree (Phase 0 gate)
        run: |
          set -e
          for d in game studio docs state artifacts reports; do
            test -d "$d" || { echo "missing dir: $d"; exit 1; }
          done
          for f in docs/GDD.md docs/TEST_PLAN.md docs/ART_BIBLE.md docs/BUDGET.md \
                   state/project-state.json state/task-queue.json state/events.jsonl \
                   studio/providers.json; do
            test -f "$f" || { echo "missing file: $f"; exit 1; }
          done
          python3 -c "import json; json.load(open('state/project-state.json')); json.load(open('state/task-queue.json')); json.load(open('studio/providers.json'))"
          echo "tree OK"

      - name: Verify no credentials in repo
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$' ; then
            echo ".env must never be committed"; exit 1
          fi
          echo "no .env tracked"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Game build
        working-directory: game
        run: npm ci && npm run build-nolog

      - name: "Playwright BVT (Phase 1 gate — headless state assertions)"
        working-directory: game
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: "Orchestrator live graph test (Phase 2 gate)"
        working-directory: studio
        run: |
          pip install -r ../requirements.txt
          python test_graph_live.py
          python test_provider_cli.py
